[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "saltimbanque"
version = "1.2.1"
authors = [
    {name = "Wanadev"},
]
description = "Provides an HTTP API to convert Web pages to PDF"
readme = "README.rst"
keywords = ["pdf", "html"]
license = "AGPL-3.0-or-later"
license-files = ["COPYING"]
requires-python = ">=3.10"
dependencies = [
    "Flask",
    "WeasyPrint",
]

[project.optional-dependencies]
dev = [
    "nox",
    "flit",
    "black",
    "flake8",
    "flake8-pyproject",
    "validate-pyproject",
]

[project.scripts]
saltimbanque = "saltimbanque.__main__:main"

[project.urls]
source = "https://github.com//wanadev/saltimbanque"
documentation = "https://github.com//wanadev/saltimbanque/blob/master/README.rst"
changelog = "https://github.com//wanadev/saltimbanque?tab=readme-ov-file#changelog"
issues = "https://github.com//wanadev/saltimbanque/issues"
chat = "https://discord.gg/BmUkEdMuFp"

[tool.black]
target-version = ["py310"]

[tool.flake8]
ignore = [
    # ↓↓ Black handles that its way... :)
    "W503",  # line break before binary operator
    "E501",  # line too long (> 79 characters)
]
